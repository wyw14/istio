apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wp
  namespace: foo
  labels:
    istio.io/rev: default
spec:
  gatewayClassName: istio-waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-waypoint
spec:
  controllerName: istio.io/mesh-controller
---
apiVersion: v1
kind: Service
metadata:
  name: foo-svc
  namespace: foo
  labels:
    istio.io/use-waypoint: wp
spec:
  selector:
    app: httpbin
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: httpbin-foo
  namespace: foo
  labels:
    app: httpbin
    istio.io/rev: v1
---
apiVersion: v1
kind: Pod
metadata:
  name: httpbin-bar
  namespace: bar
  labels:
    app: httpbin
    istio.io/rev: v1
---
apiVersion: v1
kind: Pod
metadata:
  name: revsvc-v1
  namespace: foo
  labels:
    app: revsvc
    istio.io/rev: v1
---
apiVersion: v1
kind: Pod
metadata:
  name: revsvc-v2
  namespace: foo
  labels:
    app: revsvc
    istio.io/rev: v2
---
apiVersion: v1
kind: Pod
metadata:
  name: wp-pod
  namespace: foo
  labels:
    gateway.networking.k8s.io/gateway-name: wp
    istio.io/rev: default
