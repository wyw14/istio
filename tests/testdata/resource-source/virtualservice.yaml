apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: reviews-vs
  namespace: default
spec:
  hosts:
    - reviews.default.svc.cluster.local
  gateways:
    - mesh
  http:
    - route:
        - destination:
            host: reviews.default.svc.cluster.local
            port:
              number: 9080
