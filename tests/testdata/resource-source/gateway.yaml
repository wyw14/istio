apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: bookinfo-gateway
  namespace: default
spec:
  selector:
    app: bookinfo-gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: reviews-gateway-vs
  namespace: default
spec:
  hosts:
    - reviews.default.svc.cluster.local
  gateways:
    - bookinfo-gateway
  http:
    - route:
        - destination:
            host: reviews.default.svc.cluster.local
            port:
              number: 9080
